<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Repositorio ADN Ideas 2027</title><style>body{font-family:Arial,sans-serif;background:#fff5fa;color:#302532;padding:24px}main{max-width:850px;margin:auto;background:white;padding:25px;border-radius:18px}button{padding:12px 18px;border:0;border-radius:24px;background:#ed1688;color:white;font-weight:bold;cursor:pointer;margin:4px}.item{padding:14px;border:1px solid #f0dce8;border-radius:12px;margin:12px 0;white-space:pre-wrap}small{color:#8b7885}</style></head><body><main><h1>Repositorio de ideas · ADN 2027</h1><p>Vista local de las propuestas almacenadas en este navegador.</p><button onclick="load()">Actualizar</button><button onclick="csv()">Descargar CSV</button><div id="list"></div></main><script>function rows(){return JSON.parse(localStorage.getItem('adnIdeas2027')||'[]')}function load(){let l=document.getElementById('list'),a=rows();l.innerHTML='';if(!a.length){l.textContent='Aún no hay ideas guardadas en este navegador.';return}a.slice().reverse().forEach((r,i)=>{let d=document.createElement('div');d.className='item';let s=document.createElement('small');s.textContent='Idea '+(a.length-i)+' · '+new Date(r.fecha).toLocaleString('es');let p=document.createElement('p');p.textContent=r.idea;d.append(s,p);l.append(d)})}function csv(){let a=rows(),q=x=>'"'+String(x).replace(/"/g,'""')+'"',s=['ID,Fecha,Idea',...a.map(x=>[q(x.id),q(x.fecha),q(x.idea)].join(','))].join('\n'),u=URL.createObjectURL(new Blob(['\ufeff'+s],{type:'text/csv'})),z=document.createElement('a');z.href=u;z.download='ideas-adn-2027.csv';z.click();URL.revokeObjectURL(u)}load();</script></body></html>
